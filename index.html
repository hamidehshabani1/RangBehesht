
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#e9dfc9">
  <meta name="description" content="رنگ بهشت؛ رنگی از عشق، ایثار و زیبایی">
  <title>رنگ بهشت | پیوندهای ما</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Tahoma, Arial, sans-serif;
      color: #f8f0dc;
      background:
        linear-gradient(
          rgba(34, 30, 23, 0.58),
          rgba(34, 30, 23, 0.78)
        ),
        url("assets/background.jpg") center / cover fixed;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 16px;
    }

    .container {
      width: 100%;
      max-width: 440px;
      text-align: center;
      padding: 30px 24px;
      border: 1px solid rgba(234, 214, 168, 0.55);
      border-radius: 24px;
      background: rgba(39, 34, 27, 0.72);
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(8px);
    }

    .logo {
      width: 145px;
      height: 145px;
      object-fit: contain;
      border-radius: 50%;
      border: 2px solid #d7bd86;
      background: #eee3cc;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 29px;
      color: #ead5a6;
      margin: 4px 0 14px;
    }

    .description {
      font-size: 14px;
      line-height: 2.2;
      color: #f4ead6;
      margin-bottom: 26px;
    }

    .social-link {
      display: flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
      color: #f7edd8;
      background: rgba(239, 225, 199, 0.09);
      border: 1px solid rgba(234, 214, 168, 0.45);
      border-radius: 13px;
      padding: 12px 16px;
      margin: 12px 0;
      transition: 0.25s ease;
    }

    .social-link:hover {
      background: #e6d3aa;
      color: #3b3022;
      transform: translateY(-2px);
    }

    .social-link img {
      width: 32px;
      height: 32px;
      object-fit: contain;
    }

    .social-link span {
      flex: 1;
      text-align: right;
      font-size: 15px;
      font-weight: bold;
    }

    footer {
      margin-top: 24px;
      font-size: 11px;
      color: #d7c7a8;
    }

    @media (max-width: 480px) {
      .container {
        padding: 25px 18px;
      }

      h1 {
        font-size: 25px;
      }

      .logo {
        width: 125px;
        height: 125px;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <img class="logo"
         src="assets/logo.jpg"
         alt="لوگوی رنگ بهشت">

    <h1>رنگ بهشت</h1>

    <p class="description">
      به صفحه‌ی رسمی رنگ بهشت خوش آمدید؛
      همراه با عشق، ایثار و خدمت،
      برای زیبایی و زنده نگه داشتن یاد شهدا.
    </p>

    <a class="social-link"
       href="https://www.instagram.com/YOUR_ID/"
       target="_blank" rel="noopener noreferrer">
      <img src="assets/instagram.png" alt="">
      <span>اینستاگرام</span>
    </a>

    <a class="social-link"
       href="https://t.me/YOUR_ID"
       target="_blank" rel="noopener noreferrer">
      <img src="assets/telegram.png" alt="">
      <span>تلگرام</span>
    </a>

    <a class="social-link"
       href="https://ble.ir/YOUR_ID"
       target="_blank" rel="noopener noreferrer">
      <img src="assets/bale.png" alt="">
      <span>بله</span>
    </a>
    
    <section class="info-card">
      <h2>شماره تماس</h2>
      <a class="contact-number" href="tel:09120657425">
        09120657425
      </a>
    </section>

    <section class="info-card">
      <h2>جهت واریز نذورات</h2>
      <p class="card-number" dir="ltr">
        5041721088748737
      </p>
      <p class="account-name">به نام: علیرضا اکبری</p>
      <button
        class="copy-button"
        onclick="navigator.clipboard.writeText('5041721088748737').then(() => this.textContent = 'شماره کارت کپی شد')">
        کپی شماره کارت
      </button>
    </section>


    <footer>
      رنگ بهشت؛ روایت عشق در مسیر خدمت
    </footer>

  </main>
</body>
</html>
